name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      max-parallel: 1
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Check types and tests
        run: npm run check

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: npm run build:mac -- --publish never

      - name: Publish macOS assets (private source repository)
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml

      # Public download and update channel for clients (no source code there).
      # Needs the RELEASES_TOKEN secret: a fine-grained token with "Contents: read
      # and write" on Bilal-Elhouari/Logifilm-releases only.
      - name: Publish macOS assets (public releases repository)
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          repository: Bilal-Elhouari/Logifilm-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: npm run build:win -- --publish never

      - name: Publish Windows assets (private source repository)
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

      # Public download and update channel for clients (no source code there).
      # Needs the RELEASES_TOKEN secret: a fine-grained token with "Contents: read
      # and write" on Bilal-Elhouari/Logifilm-releases only.
      - name: Publish Windows assets (public releases repository)
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          repository: Bilal-Elhouari/Logifilm-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
