name: Check & Build

# The source repository is private: GitHub Actions minutes are limited and macOS
# minutes count ten times. Every push and pull request runs a quick check on Linux;
# full installer builds run only on demand (Actions tab > Check & Build > Run workflow).
# Releases are built and published by release.yml when a version tag is pushed.

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Check types, tests and lint
        run: npm run check

  build:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm install

      # Build only: publishing is done by release.yml on version tags.
      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        run: npm run build:win -- --publish never
        env:
          NODE_ENV: production

      - name: Build for Mac
        if: matrix.os == 'macos-latest'
        run: npm run build:mac -- --publish never
        env:
          NODE_ENV: production

      - name: Upload Windows Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Logifilm-Windows
          path: release/*.exe

      - name: Upload Mac Artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Logifilm-macOS
          path: |
            release/*.dmg
            release/*.zip
